<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Login</title>
<style>body{font:16px system-ui;background:#f2f5f9;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:2rem;border-radius:12px;box-shadow:0 8px 28px #0002;width:min(340px,85vw)}label{display:block;margin-top:1rem}input{box-sizing:border-box;width:100%;padding:.7rem;margin-top:.3rem}button{margin-top:1.2rem;padding:.7rem;width:100%;background:#1456a0;color:white;border:0;border-radius:6px;cursor:pointer}#message{min-height:1.5em;margin-top:1rem}</style></head>
<body><main class="card"><h1>Learning Login</h1><p>Use <b>student</b> / <b>selenium123</b></p><form id="login-form"><label for="username">Username</label><input id="username" name="username" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><button id="login-button" type="submit">Sign in</button></form><p id="message" role="status" aria-live="polite"></p></main>
<script>document.querySelector('#login-form').addEventListener('submit',event=>{event.preventDefault();const user=document.querySelector('#username').value;const pass=document.querySelector('#password').value;const message=document.querySelector('#message');if(user==='student'&&pass==='selenium123'){message.textContent='Welcome, student!';message.dataset.result='success'}else{message.textContent='Invalid username or password';message.dataset.result='error'}});</script></body></html>
